# Blok reverse proxy Nginx untuk Ghost.
# Di aaPanel: Website → qiran.my.id → Conf (atau "Config file"),
# lalu ganti/isi blok "location /" dengan isi di bawah ini.
# Baris X-Forwarded-Proto WAJIB ada. Tanpa itu Ghost akan terus
# mengalihkan ke https dan browser menampilkan "too many redirects".

client_max_body_size 50m;

location / {
    proxy_pass http://127.0.0.1:2368;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_buffering off;
}
